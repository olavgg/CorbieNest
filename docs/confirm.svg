<svg xmlns="http://www.w3.org/2000/svg" width="607" height="156" viewBox="0 0 607 156" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace" font-size="14">
<rect width="607" height="156" rx="8" fill="#0d1117" stroke="#30363d"/>
<text y="32" xml:space="preserve" fill="#c9d1d9">
<tspan x="18">  </tspan>
<tspan x="34.8" fill="#d29922" font-weight="600">Run this command?</tspan>
</text>
<text y="52" xml:space="preserve" fill="#c9d1d9">
<tspan x="18">  </tspan>
<tspan x="34.8" fill="#ff8700">❯ </tspan>
<tspan x="51.6" fill="#ff8700" font-weight="600">1. Yes</tspan>
<tspan x="102" fill-opacity="0.62">  (y)</tspan>
</text>
<text y="72" xml:space="preserve" fill="#c9d1d9">
<tspan x="18">    2. Yes, and don't ask again for shell commands this session</tspan>
<tspan x="547.2" fill-opacity="0.62">  (a)</tspan>
</text>
<text y="92" xml:space="preserve" fill="#c9d1d9">
<tspan x="18">    3. Yes, and always allow `git status …` in this project</tspan>
<tspan x="513.6" fill-opacity="0.62">  (p)</tspan>
</text>
<text y="112" xml:space="preserve" fill="#c9d1d9">
<tspan x="18">    4. No, and tell the model what to do instead</tspan>
<tspan x="421.2" fill-opacity="0.62">  (n)</tspan>
</text>
<text y="132" xml:space="preserve" fill="#c9d1d9">
<tspan x="18">  </tspan>
<tspan x="34.8" fill="#8b949e">↑/↓ or j/k move · enter select · 1-4 / y / a / p / n · esc = no</tspan>
</text>
</svg>
