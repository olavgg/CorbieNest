name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    name: build + test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cJSON
        run: sudo apt-get update && sudo apt-get install -y libcjson-dev

      - name: Build (warnings are errors)
        run: make CFLAGS="-O2 -g -Wall -Wextra -Werror -std=gnu11"

      - name: Test
        run: make test CFLAGS="-O2 -g -Wall -Wextra -Werror -std=gnu11"
