name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      integration:
        description: "Also run the pty integration tests (timing-sensitive on hosted runners)"
        type: boolean
        default: false

jobs:
  build-and-test:
    name: build + test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cJSON and libcurl
        run: sudo apt-get update && sudo apt-get install -y libcjson-dev libcurl4-openssl-dev

      - name: Build (warnings are errors)
        run: make CFLAGS="-O2 -g -Wall -Wextra -Werror -std=gnu11"

      - name: Unit tests
        run: make test-unit CFLAGS="-O2 -g -Wall -Wextra -Werror -std=gnu11"

      # The integration tests drive the program through a pty and tmux and assert on what arrives
      # when. A shared runner delivers that output in other pieces and at another pace than a
      # developer's machine, so they are not run by default here: run them locally with
      # `make test` before a change is pushed, or start this workflow by hand with the box ticked.
      - name: Integration tests (on request)
        if: github.event_name == 'workflow_dispatch' && inputs.integration
        run: make test-integration CFLAGS="-O2 -g -Wall -Wextra -Werror -std=gnu11"
